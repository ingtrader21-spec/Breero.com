name: Backend bootstrap tool gates

on:
  pull_request:
    paths:
      - scripts/bootstrap_breero_backend.py
      - scripts/tests/**
      - .github/workflows/backend-bootstrap-tool.yml
  push:
    branches: [main]
    paths:
      - scripts/bootstrap_breero_backend.py
      - scripts/tests/**
      - .github/workflows/backend-bootstrap-tool.yml

permissions:
  contents: read

jobs:
  bootstrap-tool-quality:
    name: bootstrap-tool-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile bootstrap tool and tests
        run: python -m compileall -q scripts/bootstrap_breero_backend.py scripts/tests
      - name: Run bootstrap tool unit tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Prove dry-run behavior without applying scaffolding
        run: |
          git switch -c ci/bootstrap-tool-smoke
          python scripts/bootstrap_breero_backend.py --allow-other-branch
