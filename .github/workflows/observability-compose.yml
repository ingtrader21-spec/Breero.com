name: Observability Compose validation

on:
  pull_request:
    paths:
      - '**/*.json'
      - .codestra/production-orchestrator-contract.v1.json
      - .env.production.example
      - docker-compose.production.yml
      - docker-compose.middleware.yml
      - deploy/observability/**
      - deploy/production/**
      - scripts/ci/validate-json-contracts.py
      - .github/workflows/observability-compose.yml
  push:
    branches: [main]
    paths:
      - '**/*.json'
      - .codestra/production-orchestrator-contract.v1.json
      - .env.production.example
      - docker-compose.production.yml
      - docker-compose.middleware.yml
      - deploy/observability/**
      - deploy/production/**
      - scripts/ci/validate-json-contracts.py
      - .github/workflows/observability-compose.yml

permissions:
  contents: read

concurrency:
  group: observability-compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: compose-overlay-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate JSON syntax, duplicate keys, and image-count contract
        run: python3 scripts/ci/validate-json-contracts.py
      - name: Create empty validation fixtures
        shell: bash
        run: |
          set -euo pipefail
          for fixture in \
            /tmp/breero-database-url \
            /tmp/breero-redis-url \
            /tmp/breero-jwt-access \
            /tmp/breero-jwt-refresh \
            /tmp/breero-geoapify \
            /tmp/breero-postgres-password \
            /tmp/breero-redis-password \
            /tmp/breero-middleware-ca \
            /tmp/breero-middleware-hmac \
            /tmp/breero-middleware-client-cert \
            /tmp/breero-middleware-client-key \
            /tmp/breero-otlp-headers; do
            install -m 600 /dev/null "$fixture"
          done
      - name: Validate all production overlay combinations without starting services
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file deploy/production/compose-validation.env -f docker-compose.production.yml config --quiet
          docker compose --env-file deploy/production/compose-validation.env -f docker-compose.production.yml -f docker-compose.middleware.yml config --quiet
          docker compose --env-file deploy/production/compose-validation.env -f docker-compose.production.yml -f deploy/observability/docker-compose.observability.yml config --quiet
          docker compose --env-file deploy/production/compose-validation.env -f docker-compose.production.yml -f docker-compose.middleware.yml -f deploy/observability/docker-compose.observability.yml config --quiet
