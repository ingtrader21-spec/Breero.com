name: Publish BREERO portal images

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact merged 40-character source commit
        type: string
        required: true
      change_id:
        description: Approved artifact-publication change identifier
        type: string
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: breero-portal-image-release-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  source-gate:
    name: Verify merged exact source
    # RUNTIME_MUTATION_DISABLED=true
    # Publication must use the registered release-images.yml identity and policy.
    if: ${{ false }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      short_sha: ${{ steps.verify.outputs.short_sha }}
    environment:
      name: breero-artifact-publish
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.release_sha }}' =~ ^[0-9a-f]{40}$ ]]
          [[ '${{ inputs.change_id }}' =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{5,127}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - id: verify
        name: Require source already contained in main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          actual="$(git rev-parse HEAD)"
          test "${actual}" = '${{ inputs.release_sha }}'
          git merge-base --is-ancestor "${actual}" origin/main
          git diff --exit-code
          echo "sha=${actual}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${actual:0:12}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish ${{ matrix.app }} image
    # RUNTIME_MUTATION_DISABLED=true
    # Preserve this candidate until publication is reconciled with approved policy.
    if: ${{ false }}
    needs: source-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            directory: web
            filter: "@breero/web"
          - app: partner
            directory: partner
            filter: "@breero/partner"
          - app: ops
            directory: ops
            filter: "@breero/ops"
          - app: admin
            directory: admin
            filter: "@breero/admin"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-gate.outputs.sha }}
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Resolve Node base image to immutable digest
        shell: bash
        run: |
          set -euo pipefail
          base="node:22.14.0-alpine3.21"
          digest="$(docker buildx imagetools inspect "${base}" | awk '/^Digest:/ {print $2; exit}')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "NODE_BASE_IMAGE=node@${digest}" >> "${GITHUB_ENV}"
          echo "NODE_BASE_DIGEST=${digest}" >> "${GITHUB_ENV}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend/Dockerfile.portal
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/breero-${{ matrix.app }}:sha-${{ needs.source-gate.outputs.short_sha }}
          build-args: |
            APP_DIR=${{ matrix.directory }}
            APP_FILTER=${{ matrix.filter }}
            NODE_BUILD_IMAGE=${{ env.NODE_BASE_IMAGE }}
            NODE_RUNTIME_IMAGE=${{ env.NODE_BASE_IMAGE }}
            VCS_REF=${{ needs.source-gate.outputs.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=breero-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=breero-${{ matrix.app }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/breero-${{ matrix.app }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@v3
      - name: Keyless sign image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/breero-${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Record release manifest fragment
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/breero-${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "breero-${{ matrix.app }}-release.json" <<JSON
          {
            "application": "${{ matrix.app }}",
            "source_sha": "${{ needs.source-gate.outputs.sha }}",
            "image": "${IMAGE}@${DIGEST}",
            "node_base": "${NODE_BASE_IMAGE}",
            "change_id": "${{ inputs.change_id }}",
            "workflow_run": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON
      - uses: actions/upload-artifact@v4
        with:
          name: breero-${{ matrix.app }}-release-${{ needs.source-gate.outputs.short_sha }}
          path: breero-${{ matrix.app }}-release.json
          if-no-files-found: error
          retention-days: 90
