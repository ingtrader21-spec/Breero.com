name: Required quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      bootstrap: ${{ steps.scope.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push ]]; then
            git ls-files \
              | scripts/ci/classify-quality-scope.sh \
              | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$EVENT_NAME" == pull_request ]]
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Disable rename detection so both the deleted source and added
          # destination are classified across trust-boundary moves.
          git diff --no-renames --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" \
            | scripts/ci/classify-quality-scope.sh \
            | tee -a "$GITHUB_OUTPUT"

  backend-quality:
    needs: classify
    if: needs.classify.outputs.backend == 'true'
    uses: ./.github/workflows/backend-production.yml

  frontend-quality:
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-production.yml

  bootstrap-tool-quality:
    needs: classify
    # RUNTIME_MUTATION_DISABLED=true
    # The referenced bootstrap sources are absent at this protected-source line.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile bootstrap tool
        run: python -m compileall -q scripts/bootstrap_breero_backend.py scripts/tests/test_bootstrap_breero_backend.py
      - name: Run bootstrap safety tests
        run: python -m unittest -v scripts.tests.test_bootstrap_breero_backend
      - name: Exercise real dry-run
        run: python scripts/bootstrap_breero_backend.py --allow-other-branch

  scope-docs-quality:
    needs: classify
    if: always() && needs.classify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate BREERO scope
        run: scripts/ci/validate-breero-scope.sh
      - name: Validate Git whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
            exit 0
          fi
          [[ "$EVENT_NAME" == push ]]
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          base="$PUSH_BEFORE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] \
            || [[ "$base" == 0000000000000000000000000000000000000000 ]] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$base" "$EVENT_SHA"
      - name: Validate shell and Python sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' shell_files < <(find scripts -type f -name '*.sh' -print0 2>/dev/null || true)
          if ((${#shell_files[@]})); then bash -n "${shell_files[@]}"; fi
          python -m compileall -q scripts apps/api/app
      - name: Validate workflow syntax
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Validate portal candidate API bindings
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ARG NEXT_PUBLIC_API_BASE_URL' deploy/portals/Dockerfile
          test "$(grep -Fc 'NEXT_PUBLIC_API_BASE_URL=https://api.breero.com/api/v1' \
            .github/workflows/release-images.yml)" -eq 3
      - name: Prove path-classification scenarios
        run: scripts/ci/test-classify-quality-scope.sh
      - name: Prove BREERO scope scenarios
        run: scripts/ci/test-validate-breero-scope.sh
      - name: Validate PR consolidation ledger
        run: python scripts/pr_consolidation/validate_ledger.py
      - name: Test PR consolidation ledger validation
        run: python -m unittest discover -s scripts/pr_consolidation -p 'test_*.py'

  design-system-quality:
    needs: classify
    if: always() && needs.classify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce BREERO design system
        run: node scripts/check-design-system.mjs "${{ github.event.pull_request.base.sha }}"

  quality:
    name: quality
    needs:
      - classify
      - backend-quality
      - frontend-quality
      - bootstrap-tool-quality
      - scope-docs-quality
      - design-system-quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce every applicable quality gate
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          BACKEND_APPLICABLE: ${{ needs.classify.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          FRONTEND_APPLICABLE: ${{ needs.classify.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          BOOTSTRAP_APPLICABLE: ${{ needs.classify.outputs.bootstrap }}
          BOOTSTRAP_RESULT: ${{ needs.bootstrap-tool-quality.result }}
          SCOPE_DOCS_RESULT: ${{ needs.scope-docs-quality.result }}
          DESIGN_SYSTEM_RESULT: ${{ needs.design-system-quality.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == success ]]
          [[ "$SCOPE_DOCS_RESULT" == success ]]
          [[ "$DESIGN_SYSTEM_RESULT" == success ]]
          check_applicable() {
            local applicable="$1" result="$2" name="$3"
            if [[ "$applicable" == true ]]; then
              [[ "$result" == success ]] || { echo "::error::$name was applicable but result was $result"; return 1; }
            else
              [[ "$result" == skipped ]] || { echo "::error::$name was not applicable but result was $result"; return 1; }
            fi
          }
          check_applicable "$BACKEND_APPLICABLE" "$BACKEND_RESULT" backend-quality
          check_applicable "$FRONTEND_APPLICABLE" "$FRONTEND_RESULT" frontend-quality
          check_applicable "$BOOTSTRAP_APPLICABLE" "$BOOTSTRAP_RESULT" bootstrap-tool-quality
