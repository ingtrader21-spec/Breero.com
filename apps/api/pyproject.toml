[project]
name = "breero-api"
version = "0.1.0"
description = "BREERO marketplace and field-service API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "email-validator>=2.2,<3.0",
  "geoalchemy2>=0.17,<1.0",
  "redis>=5.2,<6.0",
  "celery>=5.4,<6.0",
  "httpx>=0.28,<1.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "stripe>=11.0,<13.0",
  "structlog>=24.4,<26.0",
  "prometheus-client>=0.21,<1.0",
  "opentelemetry-api>=1.30,<2.0",
  "opentelemetry-sdk>=1.30,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
  "opentelemetry-instrumentation-celery>=0.51b0,<1.0",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1.0",
  "opentelemetry-instrumentation-redis>=0.51b0,<1.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.51b0,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.3,<2.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0",
  "aiosqlite>=0.20,<1.0",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
