services:
  worker:
    networks: [breero_private, middleware_egress]
    extra_hosts:
      - "middleware.internal.codestra.agency:10.40.0.1"
    volumes:
      - type: bind
        source: ${BREERO_PROD_MIDDLEWARE_CA_FILE:?Set the approved Codestra CA file}
        target: /run/secrets/codestra_private_ca.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${BREERO_PROD_MIDDLEWARE_HMAC_FILE:?Set the production HMAC secret file}
        target: /run/secrets/breero_middleware_hmac
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${BREERO_PROD_MIDDLEWARE_CLIENT_CERT_FILE:?Set the production mTLS certificate}
        target: /run/secrets/breero_middleware_client.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${BREERO_PROD_MIDDLEWARE_CLIENT_KEY_FILE:?Set the production mTLS key}
        target: /run/secrets/breero_middleware_client.key
        read_only: true
        bind: {create_host_path: false}

networks:
  middleware_egress:
    name: breero_middleware_egress
    external: true
