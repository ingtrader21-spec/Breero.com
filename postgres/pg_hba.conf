# Local administration inside the PostgreSQL container.
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Breero services share the directly connected Docker network. Require the
# password verifier for all TCP clients on that network.
host    all             all             samenet                 scram-sha-256

# Deny any source that is not local or on the Breero Docker network.
host    all             all             0.0.0.0/0               reject
host    all             all             ::0/0                    reject
